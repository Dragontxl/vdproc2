name: Range Video Processing Workflow

on:
  repository_dispatch:
    types: [video-processing-range]
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Task ID'
        required: true
      start_phase:
        description: 'Starting phase'
        required: true
        type: choice
        options:
          - DETECT
          - ANALYZE
          - CROP_SHOTS
          - CONVERT_FRAMES
          - GENERATE_SHOTS
          - COMPOSE
      end_phase:
        description: 'Ending phase'
        required: true
        type: choice
        options:
          - DETECT
          - ANALYZE
          - CROP_SHOTS
          - CONVERT_FRAMES
          - GENERATE_SHOTS
          - COMPOSE
      gh_account_id:
        description: 'GitHub Account ID'
        required: true
      ai_account_id:
        description: 'AI Account ID'
        required: false

jobs:
  range-process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: ${{ inputs.task_id || github.event.client_payload.task_id }}-range
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Docker registry mirrors
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors": ["https://docker.1ms.run", "https://mirror.ccs.tencentyun.com"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          tags: ai-video-processor
          load: true
          cache-from: type=gha,ref=ai-video-processor
          cache-to: type=gha,ref=ai-video-processor,mode=max

      - name: Parse config JSON
        id: parse_config
        env:
          CONFIG_JSON: ${{ inputs.config || github.event.client_payload.config || '{}' }}
        run: |
          VIDEO_PATH=$(echo "$CONFIG_JSON" | jq -r '.video_path // ""')
          FPS=$(echo "$CONFIG_JSON" | jq -r '.fps // 30')
          PROMPT=$(echo "$CONFIG_JSON" | jq -r '.prompt // ""')
          OUTPUT_FPS=$(echo "$CONFIG_JSON" | jq -r '.output_fps // 24')
          MAX_CONCURRENT=$(echo "$CONFIG_JSON" | jq -r '.max_concurrent // 2')
          ANALYZE_DIALOGUE_LANGUAGE=$(echo "$CONFIG_JSON" | jq -r '.analyze_dialogue_language // ""')
          ANALYZE_DIALOGUE_STYLE=$(echo "$CONFIG_JSON" | jq -r '.analyze_dialogue_style // ""')
          echo "VIDEO_PATH=$VIDEO_PATH" >> $GITHUB_OUTPUT
          echo "FPS=$FPS" >> $GITHUB_OUTPUT
          echo "PROMPT=$PROMPT" >> $GITHUB_OUTPUT
          echo "OUTPUT_FPS=$OUTPUT_FPS" >> $GITHUB_OUTPUT
          echo "MAX_CONCURRENT=$MAX_CONCURRENT" >> $GITHUB_OUTPUT
          echo "ANALYZE_DIALOGUE_LANGUAGE=$ANALYZE_DIALOGUE_LANGUAGE" >> $GITHUB_OUTPUT
          echo "ANALYZE_DIALOGUE_STYLE=$ANALYZE_DIALOGUE_STYLE" >> $GITHUB_OUTPUT
          # 明确解析 start_phase 和 end_phase，确保可靠传递
          START_PHASE="${{ inputs.start_phase || github.event.client_payload.start_phase }}"
          END_PHASE="${{ inputs.end_phase || github.event.client_payload.end_phase }}"
          echo "START_PHASE=$START_PHASE" >> $GITHUB_OUTPUT
          echo "END_PHASE=$END_PHASE" >> $GITHUB_OUTPUT
          echo "Parsed START_PHASE=$START_PHASE, END_PHASE=$END_PHASE"

      - name: Run range processing (single Docker container)
        env:
          TASK_ID: ${{ inputs.task_id || github.event.client_payload.task_id }}
          GH_ACCOUNT_ID: ${{ inputs.gh_account_id || github.event.client_payload.gh_account_id }}
          AI_ACCOUNT_ID: ${{ inputs.ai_account_id || github.event.client_payload.ai_account_id }}
          VIDEO_PATH: ${{ steps.parse_config.outputs.VIDEO_PATH }}
          FPS: ${{ steps.parse_config.outputs.FPS }}
          PROMPT: ${{ steps.parse_config.outputs.PROMPT }}
          OUTPUT_FPS: ${{ steps.parse_config.outputs.OUTPUT_FPS }}
          MAX_CONCURRENT: ${{ steps.parse_config.outputs.MAX_CONCURRENT }}
          ANALYZE_DIALOGUE_LANGUAGE: ${{ steps.parse_config.outputs.ANALYZE_DIALOGUE_LANGUAGE }}
          ANALYZE_DIALOGUE_STYLE: ${{ steps.parse_config.outputs.ANALYZE_DIALOGUE_STYLE }}
          START_PHASE: ${{ steps.parse_config.outputs.START_PHASE }}
          END_PHASE: ${{ steps.parse_config.outputs.END_PHASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          AI_API_KEY: ${{ inputs.ai_api_key || github.event.client_payload.ai_api_key || secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ inputs.ai_base_url || github.event.client_payload.ai_base_url || secrets.AI_BASE_URL }}
          AI_ACCOUNTS: ${{ inputs.ai_accounts || github.event.client_payload.ai_accounts }}
          COOLDOWN_SECONDS: ${{ inputs.cooldown_seconds || github.event.client_payload.cooldown_seconds || 2 }}
          VIDEO_MODEL: ${{ inputs.video_model || github.event.client_payload.video_model || 'agnes-video-v2.0' }}
        run: |
          docker run --rm \
            -e TASK_ID="$TASK_ID" \
            -e GH_ACCOUNT_ID="$GH_ACCOUNT_ID" \
            -e AI_ACCOUNT_ID="$AI_ACCOUNT_ID" \
            -e VIDEO_PATH="$VIDEO_PATH" \
            -e FPS="$FPS" \
            -e PROMPT="$PROMPT" \
            -e OUTPUT_FPS="$OUTPUT_FPS" \
            -e MAX_CONCURRENT="$MAX_CONCURRENT" \
            -e ANALYZE_DIALOGUE_LANGUAGE="$ANALYZE_DIALOGUE_LANGUAGE" \
            -e ANALYZE_DIALOGUE_STYLE="$ANALYZE_DIALOGUE_STYLE" \
            -e START_PHASE="$START_PHASE" \
            -e END_PHASE="$END_PHASE" \
            -e R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
            -e R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
            -e R2_ENDPOINT_URL="$R2_ENDPOINT_URL" \
            -e R2_BUCKET_NAME="$R2_BUCKET_NAME" \
            -e CALLBACK_URL="$CALLBACK_URL" \
            -e CALLBACK_SECRET="$CALLBACK_SECRET" \
            -e BACKEND_API_KEY="$BACKEND_API_KEY" \
            -e AI_API_KEY="$AI_API_KEY" \
            -e AI_BASE_URL="$AI_BASE_URL" \
            -e COOLDOWN_SECONDS="$COOLDOWN_SECONDS" \
            -e AI_ACCOUNTS="$AI_ACCOUNTS" \
            -e VIDEO_MODEL="$VIDEO_MODEL" \
            ai-video-processor \
            bash /scripts/run-phases.sh

      - name: Notify completion
        if: always()
        env:
          TASK_ID: ${{ inputs.task_id || github.event.client_payload.task_id }}
          STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          # 使用解析后的输出，确保可靠获取 start_phase 和 end_phase
          START_PHASE: ${{ steps.parse_config.outputs.START_PHASE }}
          END_PHASE: ${{ steps.parse_config.outputs.END_PHASE }}
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=5
          SUCCESS=0
          
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt/$MAX_RETRIES to notify completion..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              "$CALLBACK_URL/github" \
              -H "Content-Type: application/json" \
              -H "X-Callback-Signature: $CALLBACK_SECRET" \
              -d "{
                \"task_id\": \"$TASK_ID\",
                \"status\": \"$STATUS\",
                \"run_id\": \"$RUN_ID\",
                \"run_number\": \"$RUN_NUMBER\",
                \"phase\": \"$END_PHASE\",
                \"start_phase\": \"$START_PHASE\",
                \"end_phase\": \"$END_PHASE\"
              }")
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            
            echo "Completion callback response code: $HTTP_CODE"
            echo "Completion callback response body: $BODY"
            
            if [ "$HTTP_CODE" -eq 200 ]; then
              SUCCESS=1
              break
            fi
            
            if [ "$attempt" -lt "$MAX_RETRIES" ]; then
              echo "Completion notification failed, retrying in $RETRY_DELAY seconds..."
              sleep $RETRY_DELAY
            fi
          done
          
          if [ $SUCCESS -ne 1 ]; then
            echo "ERROR: Failed to notify completion after $MAX_RETRIES attempts"
            exit 1
          fi
