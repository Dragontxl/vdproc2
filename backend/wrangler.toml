[env.production]
name = "ai-video-worker"
main = "src/index.ts"

[env.production.vars]
ENVIRONMENT = "production"
GITHUB_REPO_OWNER = "Dragontxl"
GITHUB_REPO_NAME = "vdproc2"
FRONTEND_URL = "https://vdpr2.ygtxl.dpdns.org"
ADMIN_URL = "https://vdpr2.ygtxl.dpdns.org"
R2_PUBLIC_URL = "https://api.vdpr2.ygtxl.dpdns.org/api/v1/files"

[[env.production.d1_databases]]
binding = "DB"
database_name = "ai-video-db"
database_id = "75b5c974-04a5-4b27-9520-c5e3349903e4"

[[env.production.r2_buckets]]
binding = "R2"
bucket_name = "ai-video-bucket"

[[env.production.kv_namespaces]]
binding = "KV"
id = "2571947d6a3944a2a7f3e99f4679de10"

[env.production.triggers]
crons = ["*/5 * * * *"]

